---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-adept-helmetica-io-v1-maintenancewindow
  failurePolicy: Fail
  name: vmaintenancewindow.adept.helmetica.io
  rules:
  - apiGroups:
    - adept.helmetica.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - maintenancewindows
  sideEffects: None
