# Teaches kustomize that the service reference inside a webhook configuration
# is a name reference, so namePrefix and namespace reach it. Without this the
# generated configuration keeps pointing at "webhook-service" in "system" and
# the API server calls a service that does not exist.
nameReference:
- kind: Service
  version: v1
  fieldSpecs:
  - kind: ValidatingWebhookConfiguration
    group: admissionregistration.k8s.io
    path: webhooks/clientConfig/service/name

namespace:
- kind: ValidatingWebhookConfiguration
  group: admissionregistration.k8s.io
  path: webhooks/clientConfig/service/namespace
  create: true
