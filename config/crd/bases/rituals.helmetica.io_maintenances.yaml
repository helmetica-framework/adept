---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: maintenances.rituals.helmetica.io
spec:
  group: rituals.helmetica.io
  names:
    kind: Maintenance
    listKind: MaintenanceList
    plural: maintenances
    singular: maintenance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.window
      name: Window
      type: string
    - jsonPath: .spec.ritual
      name: Ritual
      type: string
    - jsonPath: .status.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Maintenance is one instance's maintenance schedule. It lives in the instance
          namespace, names a MaintenanceWindow to run in and a Definition to run, and
          produces the CronJob that fires it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MaintenanceSpec schedules one instance's maintenance. Every field is
              optional: an empty spec is a complete schedule, running the maintenance
              ritual in the operator's default window.
            properties:
              ritual:
                default: maintenance
                description: Ritual names the Definition to run, in this namespace.
                minLength: 1
                type: string
              suspend:
                description: |-
                  Suspend stops maintenance for this instance. Its schedule stays in
                  place and stays visible.
                type: boolean
              window:
                description: |-
                  Window names the MaintenanceWindow this instance's maintenance starts
                  in. Empty takes the window the operator marked as the default.
                type: string
            type: object
          status:
            description: MaintenanceStatus reports the schedule this instance resolved
              to.
            properties:
              cronJobName:
                description: CronJobName is the CronJob executing the schedule, in
                  this namespace.
                type: string
              message:
                description: Message explains why no schedule could be resolved.
                type: string
              observedBumpRequest:
                description: |-
                  ObservedBumpRequest is the value of the
                  rituals.helmetica.io/bump-now annotation this instance last acted on.
                  Set the annotation to any new value to move the version straight away
                  instead of waiting for the window.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the schedule was computed
                  from.
                format: int64
                type: integer
              schedule:
                description: |-
                  Schedule is the cron expression this instance runs on, including its
                  offset within the window.
                type: string
              versionUpdatedFor:
                description: |-
                  VersionUpdatedFor is the maintenance this instance's version was last
                  moved for. It stays empty while the instance pins its own version.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
