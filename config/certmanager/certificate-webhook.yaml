apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/name: adept
    app.kubernetes.io/managed-by: kustomize
  # Referenced by name from the replacements in config/default; renaming it
  # there and not here silently drops the CA injection annotation.
  name: serving-cert
  namespace: system
spec:
  # The placeholders are replaced with the webhook service's real name and
  # namespace by the replacements in config/default/kustomization.yaml.
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
