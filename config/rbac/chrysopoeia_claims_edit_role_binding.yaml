# Writing status.version on a claim. The roleRef dangles until chrysopoeia is
# installed; that grants nothing and is not an error.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: clusterrolebinding
    app.kubernetes.io/instance: chrysopoeia-claims-edit-rolebinding
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: adept
    app.kubernetes.io/part-of: adept
    app.kubernetes.io/managed-by: kustomize
  name: chrysopoeia-claims-edit-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chrysopoeia-dynamic-crds-edit
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
